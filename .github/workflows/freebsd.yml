name: FreeBSD

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ['x86_64']
        #arch: ['x86_64', 'aarch64']  # currently disabled for speed
        # The OS supports riscv64 and powerpc64, but there are no prebuilt
        # binaries so we'd have to build dependencies from source
        #arch: ['x86_64', 'aarch64', 'riscv64', 'powerpc64']

    name: FreeBSD (${{ matrix.arch }})
    steps:
    - name: Checkout
      # This is actions/checkout@v6.0.2
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        submodules: true
        fetch-depth: 1

    - name: Setup VM
      uses: vmactions/freebsd-vm@v1
      with:
        # Note to use this you may need to merge all the steps into one.
        # debug-on-error: true
        # vnc-password: ${{ secrets.VNC_PASSWORD }}
        arch: ${{ matrix.arch }}
        usesh: true
        cpu: 4
        prepare: |
          pkg update
          pkg install -y autoconf automake bash curl bzip2 gmake libdeflate perl5
        run: |
          # Useful diagnostics
          pwd
          freebsd-version
          uname -a
          sysctl hw.ncpu
          sysctl hw.physmem
          sysctl hw.usermem

    - name: Configure
      shell: freebsd {0}
      run: |
        autoreconf -i
        ./configure --with-libdeflate --enable-werror --enable-plugins CFLAGS="-g -O3 -fsanitize=address,undefined -DHTS_ALLOW_UNALIGNED=0 -Wno-format-truncation -Wno-format-overflow" CPPFLAGS="-I/usr/local/include" LDFLAGS="-fsanitize=address,undefined -L/usr/local/lib -Wl,-R/usr/local/lib"

    - name: Build
      shell: freebsd {0}
      run: |
        gmake -j5

    - name: Test
      shell: freebsd {0}
      run: |
        gmake check
